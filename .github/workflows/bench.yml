name: Benchmarks

# Runs the benchmarks in `bench/suite` on CI. Only runs when started by hand from the
# Actions tab, since CI timings have been too inconsistent to run on every commit (see
# `bench/README.md`).
#
# The results table is shown in the job summary, and the JSON file is uploaded as an
# artifact. If `save` is ticked, the results are also saved to the `benchmark-results`
# branch, where the website in `bench/web` reads them from.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch, or tag to benchmark (defaults to the branch selected above)'
        type: string
        default: ''
      label:
        description: 'Label for the run (defaults to the commit message)'
        type: string
        default: ''
      release:
        description: 'Label the run with the release tag (the commit must have a WrenCore-v* tag)'
        type: boolean
        default: false
      save:
        description: 'Save the results to the benchmark-results branch'
        type: boolean
        default: false

permissions:
  # needed to allow julia-actions/cache to delete old caches that it has created
  actions: write
  # needed to push to the benchmark-results branch
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ inputs.ref }}
          # `run.jl` needs the tags for `--release`, and the history to find the commit
          # date.
          fetch-depth: 0

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # 3.0.2
        with:
          version: '1'

      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # 3.1.0

      - name: Install dependencies
        run: julia --color=yes --project=bench -e 'using Pkg; Pkg.instantiate()'

      - name: Run benchmarks
        run: |
          # `run.jl` commits to the results branch itself when saving.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          [[ -n "$LABEL" ]] && args+=(--label "$LABEL")
          [[ "$RELEASE" == true ]] && args+=(--release)
          [[ "$SAVE" != true ]] && args+=(--no-save)
          julia --color=yes --project=bench bench/suite/run.jl "${args[@]}" | tee bench.log
          # Put the results table (and any errors) in the job summary.
          {
            echo "Commit: \`$(git rev-parse --short HEAD)\`"
            echo
            echo '```'
            sed -n '/^Ratios are vs primal:/,/^Results written to/p' bench.log | sed '$d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DATADEPS_ALWAYS_ACCEPT: "true"
          OPENBLAS_NUM_THREADS: "1"
          LABEL: ${{ inputs.label }}
          RELEASE: ${{ inputs.release }}
          SAVE: ${{ inputs.save }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: benchmark-results
          path: bench/suite/results/*.json
