name: CI

on:
  push:
    branches:
      - main
  pull_request:

# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read

# Cancel existing tests on the same PR if a new commit is added to a pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') || github.ref == 'refs/heads/main' }}

jobs:
  test-all:
    runs-on: ${{ matrix.runner.os }}
    strategy:
      fail-fast: false

      matrix:
        runner:
          # Ubuntu
          - version: '1'
            os: blacksmith-4vcpu-ubuntu-2404

          # TODO(penelopeysm): Re-enable testing on more platforms once the repo is public.
          # For now we keep the matrix small to avoid spending too many CI minutes.
          # # Windows
          # - version: '1'
          #   os: windows-latest
          # # macOS
          # - version: '1'
          #   os: macos-latest

    steps:
      - uses: useblacksmith/checkout@v1 # 7.0.1

      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # 3.0.2
        with:
          version: ${{ matrix.runner.version }}

      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # 3.1.0

      - run: ./runtests core
