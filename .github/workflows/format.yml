name: Format

on:
  # TODO(penelopeysm): Re-enable once the repo is public.
  # push:
  #   branches:
  #     - main
  # pull_request:

jobs:
  format:
    name: Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # 3.0.2
      - uses: julia-actions/cache@b7788abd52452d5bc033d69796e110d9906af4ab # 3.2.0

      - name: Check formatting
        run: |
          julia -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.update(); Pkg.Apps.add(name="JuliaFormatter", version=v"2.10.1")'
          ${HOME}/.julia/bin/jlfmt --check --verbose .
